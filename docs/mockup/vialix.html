<title>Vialix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Jacquard+24&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Juego a pantalla completa: lienzo de pixel art con la interfaz flotando encima, en madera, latón y pergamino. */
:root{
  --night:#0d0812; --wood:#2e1c22; --wood2:#45282c; --wood3:#5e3832; --wood-hi:#7d4e3c;
  --brass:#e8a33a; --gold:#ffd34d; --parch:#efe0bd; --parch2:#d9c296; --parch3:#b39466;
  --ink:#140c1c; --ink-soft:#3a2418; --ruby:#9a2030; --jade:#2f7a3a;
  --f-disp:'Jacquard 24', 'UnifrakturCook', Georgia, serif;
  --f-ui:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-print:'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-head:'IM Fell English SC', Georgia, 'Times New Roman', serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--parch);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--f-ui);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#frame{position:relative;overflow:hidden;background:#000;touch-action:none;box-shadow:0 0 0 2px #000,0 30px 90px rgba(0,0,0,.7)}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.sceneUI{position:absolute;inset:0;pointer-events:none;will-change:transform}
.sceneUI>*{pointer-events:auto}
.pximg{image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:7px 8px;z-index:8;pointer-events:none}
#hud .sp{flex:1}
.chip{pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(20,12,28,.82);padding:3px 8px 4px;font-size:14px;color:var(--parch);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.22);border:0;line-height:1.2;font-variant-numeric:tabular-nums}
.chip img{width:16px;height:16px}
.chip .lbl{font-size:11px;color:var(--parch3);letter-spacing:.06em;text-transform:uppercase}
#cCoins b{color:var(--gold);font-weight:700;min-width:2.2em;display:inline-block}
#cRep{letter-spacing:1px;color:var(--gold)}
#cRep i{color:#5e4a3a;font-style:normal}

/* Navegación entre estaciones */
#nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;background:linear-gradient(#2e1c22,#1a0f14);box-shadow:inset 0 2px 0 #5e3832,inset 0 4px 0 #140c1c;z-index:9}
#nav button{flex:1;background:none;border:0;color:#a88a6e;font:500 12px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;letter-spacing:.04em}
#nav button img{width:20px;height:20px;opacity:.75}
#nav button.on{color:var(--gold)}
#nav button.on img{opacity:1}
#nav button[disabled]{color:#5e4a44;cursor:default}
#nav button[disabled] img{opacity:.35}
#navInd{position:absolute;top:0;height:3px;background:var(--gold);box-shadow:0 0 10px var(--gold);transition:left .5s cubic-bezier(.65,0,.35,1)}
.badge{position:absolute;margin:-30px 0 0 26px;min-width:16px;height:16px;padding:0 3px;box-sizing:border-box;background:#c8323c;color:#fff;font-size:11px;line-height:16px;box-shadow:0 0 0 2px var(--ink)}

/* Ventanilla */
#bubble{position:absolute;left:14px;right:14px;background:var(--parch);color:var(--ink-soft);padding:9px 12px 11px;font-size:16px;line-height:1.35;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--parch2),0 0 0 6px var(--ink),0 10px 0 4px rgba(0,0,0,.28);z-index:3;min-height:2.7em;cursor:pointer}
#bubble b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a1f34;margin-bottom:2px}
#bubble p{margin:0;text-wrap:pretty}
#bubble .tail{display:none;position:absolute;bottom:-12px;width:16px;height:12px;background:var(--ink);clip-path:polygon(0 0,100% 0,20% 100%)}
#bubble .tail::after{content:"";position:absolute;left:3px;top:0;width:10px;height:8px;background:var(--parch);clip-path:polygon(0 0,100% 0,15% 100%)}
#bubble .more{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--parch3);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#stamps,#vNext{position:absolute;left:0;right:0;bottom:52px;height:96px;display:flex;gap:10px;padding:0 12px 8px;box-sizing:border-box;align-items:flex-end;z-index:4}
#vNext{justify-content:center}
.stamp{flex:1;position:relative;height:86px;border:0;background:none;padding:0}
.stamp .knob{position:absolute;left:50%;top:0;width:28px;height:20px;transform:translateX(-50%);border-radius:50% 50% 35% 35%;background:var(--k);box-shadow:inset -5px -3px 0 rgba(0,0,0,.35),inset 4px 3px 0 rgba(255,255,255,.28),0 0 0 2px var(--ink)}
.stamp .neck{position:absolute;left:50%;top:19px;width:12px;height:14px;transform:translateX(-50%);background:var(--k2);box-shadow:0 0 0 2px var(--ink),inset -3px 0 0 rgba(0,0,0,.3)}
.stamp .block{position:absolute;left:2px;right:2px;top:33px;height:20px;background:#7d4e3c;box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 #a06a48,inset 0 -4px 0 #45282c}
.stamp .face{position:absolute;left:6px;right:6px;top:53px;height:26px;display:grid;place-items:center;background:var(--inkc);color:#fff4e0;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.18)}
.stamp.red{--k:#d8434e;--k2:#8a1f34;--inkc:#9a2030}
.stamp.amber{--k:#ffb84a;--k2:#a8642a;--inkc:#a8642a}
.stamp.green{--k:#6cd06a;--k2:#2f6b34;--inkc:#2f7a3a}
.stamp[disabled]{filter:grayscale(.9) brightness(.55);cursor:default}
.stamp.ready .face{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 16px 2px rgba(108,208,106,.75),inset 0 -3px 0 rgba(0,0,0,.3)}}
.stamp.slam{animation:slam .34s cubic-bezier(.3,0,.3,1.4)}
@keyframes slam{0%{transform:none}35%{transform:translateY(-20px) scale(1.06)}70%{transform:translateY(7px) scale(.96,.9)}100%{transform:none}}
.btn{border:0;padding:0 16px;height:46px;background:linear-gradient(#5e3832,#45282c);color:var(--parch);font:500 15px var(--f-ui);letter-spacing:.03em;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #7d4e3c,inset 0 -3px 0 #2e1c22;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn img{width:20px;height:20px}
.btn.gold{background:linear-gradient(#ffd34d,#e8a33a);color:#3a2418;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #fff0b0,inset 0 -3px 0 #a8642a}
.btn.big{height:54px;padding:0 26px;font-size:17px}
.btn[disabled]{filter:grayscale(.8) brightness(.6);cursor:default}
.btn.glowy{animation:glowy 1.4s ease-in-out infinite}
@keyframes glowy{50%{box-shadow:0 0 0 2px var(--ink),0 0 20px 4px rgba(255,211,77,.55),inset 0 2px 0 #fff0b0,inset 0 -3px 0 #a8642a}}
#potInfo{position:absolute;left:50%;transform:translateX(-50%);bottom:152px;background:rgba(20,12,28,.9);padding:5px 10px;font-size:13px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.3);z-index:4}
#potInfo em{font-style:normal;color:var(--gold)}

/* Taller */
#predict{position:absolute;left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink-soft);padding:5px 12px 6px;font-size:14px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 -2px 0 var(--parch2);z-index:3;text-align:center;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
#predict small{display:block;font-size:11px;color:#7a5a3a;margin-top:1px}
#predict.warn{background:#ffd9c8;color:#8a1f34;animation:shakeX .25s linear infinite}
@keyframes shakeX{25%{transform:translateX(calc(-50% - 1px))}75%{transform:translateX(calc(-50% + 1px))}}
#qual{color:#a8642a;letter-spacing:1px}
#tCtrl{position:absolute;left:0;right:0;bottom:158px;height:50px;display:flex;gap:6px;align-items:center;padding:0 8px;box-sizing:border-box;z-index:4}
#modes{flex:1;display:flex;gap:5px;min-width:0}
.mode{flex:1;min-width:0;height:46px;border:0;background:#2e1c22;color:#cdb08a;font:500 11px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #5e3832,inset 0 -3px 0 #1e1218}
.mode img{width:18px;height:18px}
.mode.on{background:#5e3832;color:var(--gold);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--gold),0 0 16px rgba(255,211,77,.4)}
#tCtrl .btn{height:46px;padding:0 10px;font-size:13px}
#bBottle{min-width:86px}
#drawer{position:absolute;left:0;right:0;bottom:52px;height:104px;background:linear-gradient(#3d2428,#22141a);box-shadow:inset 0 2px 0 #7d4e3c,inset 0 4px 0 #140c1c;z-index:4}
#ingList{display:flex;gap:9px;overflow-x:auto;padding:11px 10px 9px;height:100%;box-sizing:border-box;scrollbar-width:none;touch-action:pan-x}
#ingList::-webkit-scrollbar{display:none}
.ing{flex:0 0 76px;background:#1e1218;border:0;color:var(--parch);padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px #5e3832;font:400 11px/1.1 var(--f-ui);text-align:center;position:relative}
.ing:active{transform:translateY(2px)}
.ing canvas{width:36px;height:36px}
.ing .nm{min-height:2.2em;display:flex;align-items:center}
.ing .es{display:flex;gap:4px;font-size:11px;align-items:center;color:var(--parch2)}
.ing .es img{width:11px;height:11px;margin-right:1px;vertical-align:-1px}
.ing .es .unk{color:#8a7a9a;letter-spacing:.1em}
.ing.flash{animation:ingflash .8s}
@keyframes ingflash{30%{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--gold),0 0 18px rgba(255,211,77,.7)}}
#waitBadge{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:rgba(20,12,28,.88);padding:5px 10px;font-size:12px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(216,67,78,.5);z-index:5;cursor:pointer}
#waitBadge img{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
#gusSay{position:absolute;background:var(--parch);color:var(--ink-soft);font-size:12px;padding:4px 8px;box-shadow:0 0 0 2px var(--ink);white-space:nowrap;z-index:4;transform:translateX(-100%)}

/* Avisos */
#toast{position:absolute;left:50%;top:88px;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;background:rgba(20,12,28,.94);color:var(--parch);padding:8px 12px;font-size:13px;line-height:1.3;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.35);z-index:30;text-align:center;animation:toastIn .25s ease-out}
#toast.bad{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(216,67,78,.8)}
@keyframes toastIn{from{transform:translate(-50%,-8px);opacity:0}}
#soot{position:absolute;left:0;top:0;z-index:25;touch-action:none}
#sootHint{position:absolute;left:0;right:0;bottom:46%;text-align:center;z-index:26;font-size:15px;color:#ffd9b0;text-shadow:0 2px 0 #000;pointer-events:none;animation:blink 1.2s steps(2) infinite}

/* Superposiciones */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(8,4,12,.6)}
.ov[hidden]{display:none!important}
.paper{background:var(--parch);color:var(--ink-soft);box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--parch3),0 0 0 7px var(--ink),0 18px 40px rgba(0,0,0,.55);position:relative}

/* Portada */
#ovTitle{background:radial-gradient(ellipse at 50% 38%,rgba(13,8,18,.15),rgba(13,8,18,.82) 70%);flex-direction:column;justify-content:flex-start;padding-top:22%;gap:6px;text-align:center}
#logo{font:400 92px/0.9 var(--f-disp);margin:0;background:linear-gradient(180deg,#fff6c8 0%,#ffd34d 38%,#e8a33a 62%,#b9522c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1a1a) drop-shadow(0 0 22px rgba(255,170,60,.55));animation:logoIn 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes logoIn{from{transform:scale(.6) translateY(20px);opacity:0;filter:blur(6px)}}
#ovTitle .tag{font-size:15px;color:var(--parch);text-shadow:0 2px 0 #000;max-width:24em;line-height:1.4}
#ovTitle .tag em{color:var(--gold);font-style:normal}
#ovTitle .btn{margin-top:22px}
#ovTitle .ver{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:#a88a6e;text-shadow:0 1px 0 #000}

/* Edicto */
.scroll{width:min(330px,100%);padding:26px 22px 22px;box-sizing:border-box;text-align:center;animation:unfurl .75s cubic-bezier(.2,.8,.2,1);background:linear-gradient(#f3e6c6,#e6d2a6);color:#3a2418}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:12px;background:linear-gradient(#a06a48,#5e3832);box-shadow:0 0 0 2px var(--ink)}
.scroll::before{top:-10px}.scroll::after{bottom:-10px}
@keyframes unfurl{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.scroll h2{font:400 34px/1 var(--f-disp);margin:0 0 2px;color:#5a1a24}
.scroll .num{font:italic 14px var(--f-print);color:#7a5a3a;margin-bottom:12px}
.scroll p{font:17px/1.42 var(--f-print);margin:0 0 12px;text-wrap:pretty}
.scroll .sig{font:italic 14px var(--f-print);color:#7a5a3a}
.scroll .ban{display:inline-block;margin:2px 0 14px;padding:3px 10px;font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:#9a2030;box-shadow:0 0 0 2px #9a2030}
.seal{display:block;margin:6px auto 0;width:72px;height:72px;animation:sealDrop .5s .65s both cubic-bezier(.4,0,.6,1.6)}
@keyframes sealDrop{from{transform:scale(3) rotate(-20deg);opacity:0}}
.scroll .btn{margin-top:14px}

/* Resultado */
.card{width:min(320px,100%);padding:20px 18px 18px;box-sizing:border-box;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card canvas{width:96px;height:128px;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 18px var(--glow,rgba(255,211,77,.5)))}
.card h3{font:700 22px var(--f-ui);margin:0;color:#3a2418}
.card .meta{font-size:13px;color:#7a5a3a;margin:3px 0}
.card .sec{font-size:13px;margin:6px 0 2px}
.card .q{color:#a8642a;font-size:18px;letter-spacing:2px}
.card .acts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.card .btn{width:100%}
.newstamp{position:absolute;top:16px;right:-8px;transform:rotate(12deg);font:700 13px var(--f-ui);letter-spacing:.06em;color:#9a2030;padding:4px 8px;box-shadow:0 0 0 3px #9a2030;background:rgba(239,224,189,.85);animation:stampIn .4s cubic-bezier(.3,0,.3,1.5)}
@keyframes stampIn{from{transform:rotate(12deg) scale(2.6);opacity:0}}

/* Libro (códice y libreta) */
.book{width:min(360px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px 16px;box-sizing:border-box;background:#efe0bd}
.book h2{font:400 32px/1 var(--f-disp);margin:0 0 10px;color:#5a1a24;text-align:center}
.book h4{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#8a1f34;margin:14px 0 6px}
.grid5{display:grid;grid-template-columns:28px repeat(3,1fr);gap:3px;font-size:12px}
.grid5 .h{font-size:11px;color:#7a5a3a;text-align:center;padding:2px 0}
.grid5 .r{display:grid;place-items:center}
.grid5 .r img{width:14px;height:14px}
.cell{padding:6px 2px;text-align:center;background:#e2cfa4;color:#3a2418;box-shadow:inset 0 0 0 1px #c6ad80;min-height:16px;display:grid;place-items:center;line-height:1.1}
.cell.unk{color:#a8916a;background:#d9c296}
.cell.new{animation:ingflash 1.2s 2}
.ings{display:grid;gap:4px;font-size:13px}
.ings div{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;background:#e2cfa4}
.ings span{display:flex;gap:6px;align-items:center;white-space:nowrap}
.ings img{width:11px;height:11px}
.note{padding:10px;background:#e2cfa4;margin-bottom:8px;box-shadow:inset 0 0 0 1px #c6ad80}
.note b{display:block;font-size:12px;color:#8a1f34;text-transform:uppercase;letter-spacing:.06em}
.note q{font:italic 15px/1.35 var(--f-print);display:block;margin-top:4px}
.book .btn{width:100%;margin-top:14px}
.empty{font:italic 15px var(--f-print);color:#7a5a3a;text-align:center;padding:8px}

/* Cierre */
.ledger{width:min(330px,100%);padding:20px 18px;box-sizing:border-box;background:#efe0bd}
.ledger h2{font:400 32px/1 var(--f-disp);margin:0 0 4px;color:#5a1a24;text-align:center}
.ledger .sub{text-align:center;font:italic 14px var(--f-print);color:#7a5a3a;margin-bottom:12px}
.ledger table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ledger td{padding:5px 2px;border-bottom:1px dashed #c6ad80}
.ledger td:last-child{text-align:right;white-space:nowrap}
.ledger .pos{color:#2f7a3a}.ledger .neg{color:#9a2030}
.ledger tfoot td{font-weight:700;border-bottom:0;padding-top:8px}
.ledger .btn{width:100%;margin-top:16px}

/* La Gaceta */
#ovGaceta{background:rgba(8,4,12,.85);align-items:flex-start;overflow:auto}
.gaceta{width:min(380px,100%);margin:auto 0;padding:16px 16px 18px;box-sizing:border-box;background:#efe5cc;background-image:radial-gradient(rgba(90,60,30,.07) 1px,transparent 1.4px);background-size:5px 5px;color:#211810;box-shadow:0 0 0 2px var(--ink),0 22px 50px rgba(0,0,0,.6);animation:press .7s cubic-bezier(.2,.9,.25,1.15)}
@keyframes press{0%{transform:translateY(110%) rotate(3deg)}100%{transform:none}}
.gaceta .mast{text-align:center;border-bottom:3px double #211810;padding-bottom:6px}
.gaceta .mast h1{font:400 42px/0.95 var(--f-disp);margin:0;letter-spacing:.01em}
.gaceta .mast div{font:italic 12px var(--f-print);display:flex;justify-content:space-between;gap:6px;border-top:1px solid #211810;margin-top:6px;padding-top:3px}
.gaceta .lead{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #211810}
.gaceta .lead h2{font:400 24px/1.08 var(--f-head);margin:0;text-wrap:balance}
.gaceta .lead p{font:14px/1.35 var(--f-print);margin:6px 0 0}
.gaceta .lead canvas{width:92px;height:92px;background:#d9cba8;box-shadow:inset 0 0 0 1px #211810;filter:grayscale(.55) sepia(.45) contrast(1.2)}
.gaceta .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px}
.gaceta h3{font:400 15px/1.1 var(--f-head);margin:6px 0 4px;border-bottom:1px solid #211810;padding-bottom:2px}
.gaceta .it{font:13px/1.35 var(--f-print);margin:0 0 7px}
.gaceta .st{color:#7a3a10;letter-spacing:1px;font-family:var(--f-ui);font-size:12px}
.gaceta .full{grid-column:1/-1}
.gaceta .btn{width:100%;margin-top:12px}
@media (max-width:340px){.gaceta .cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="frame">
  <canvas id="cv"></canvas>

  <div id="vUI" class="sceneUI">
    <div id="bubble" hidden><b id="bName"></b><p id="bText"></p><span class="tail"></span><span class="more" id="bMore" hidden>▼</span></div>
    <div id="potInfo" hidden></div>
    <div id="stamps" hidden>
      <button class="stamp red" id="stR" aria-label="Rechazar"><span class="knob"></span><span class="neck"></span><span class="block"></span><span class="face">Rechazar</span></button>
      <button class="stamp amber" id="stA" aria-label="Apuntar en la libreta"><span class="knob"></span><span class="neck"></span><span class="block"></span><span class="face">Apuntar</span></button>

  const tb=$('#tBadge');if(V.cl&&V.cl.state==='wait'&&cam.to===0&&!S.vitrina.length){tb.hidden=false;tb.textContent='!'}else tb.hidden=true;
}
function render(){
  X.setTransform(1,0,0,1,0,0);X.imageSmoothingEnabled=false;X.fillStyle='#000';X.fillRect(0,0,cv.width,cv.height);
  const sx=shake>0?Math.round(rnd(-shake,shake))*s:0,sy=shake>0?Math.round(rnd(-shake,shake))*s:0;
  const moving=cam.t<1;const vel=moving?Math.abs(Math.sin(cam.t*Math.PI)):0;
  const scenes=[V,T];
  for(let i=0;i<2;i++){const off=(i-cam.x)*W;if(Math.abs(off)>=W)continue;const sc=scenes[i];sc.render();const ox=Math.round(off*s)+sx;
    X.drawImage(sc.buf,ox,sy,W*s,H*s);
    if(moving&&!RM){X.globalAlpha=.28*vel;const d=Math.round(vel*14)*s;X.drawImage(sc.buf,ox-d,sy,W*s,H*s);X.drawImage(sc.buf,ox+d,sy,W*s,H*s);X.globalAlpha=1}
    sc.fx(ox,sy)}
  if(moving&&!RM){X.fillStyle=`rgba(10,5,16,${.35*vel})`;X.fillRect(0,0,cv.width,cv.height);X.globalCompositeOperation='lighter';for(let i=0;i<10;i++){const y=((i*97+clock*40)%H)*s;X.fillStyle=`rgba(255,240,200,${.07*vel})`;X.fillRect(0,y,cv.width,s)}X.globalCompositeOperation='source-over'}
  if(flash>0){X.fillStyle=`rgba(255,240,210,${flash})`;X.fillRect(0,0,cv.width,cv.height)}
  // la interfaz de cada escena se desplaza con la cámara
  $('#vUI').style.transform=`translateX(${(-cam.x*W*u).toFixed(1)}px)`;$('#tUI').style.transform=`translateX(${((1-cam.x)*W*u).toFixed(1)}px)`;
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(hitstop>0){hitstop-=dt;dt=0}update(dt);render();requestAnimationFrame(loop)}
