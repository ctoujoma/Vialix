<title>Vialix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Jacquard+24&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Juego a pantalla completa: lienzo de pixel art con la interfaz flotando encima, en madera, latón y pergamino. */
:root{
  --night:#0d0812; --wood:#2e1c22; --wood2:#45282c; --wood3:#5e3832; --wood-hi:#7d4e3c;
  --brass:#e8a33a; --gold:#ffd34d; --parch:#efe0bd; --parch2:#d9c296; --parch3:#b39466;
  --ink:#140c1c; --ink-soft:#3a2418; --ruby:#9a2030; --jade:#2f7a3a;
  --f-disp:'Jacquard 24', 'UnifrakturCook', Georgia, serif;
  --f-ui:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-print:'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-head:'IM Fell English SC', Georgia, 'Times New Roman', serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--parch);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--f-ui);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#frame{position:relative;overflow:hidden;background:#000;touch-action:none;box-shadow:0 0 0 2px #000,0 30px 90px rgba(0,0,0,.7)}
#stage{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;background:#000;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.scv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.face .shade{position:absolute;inset:0;background:#05020a;opacity:0;pointer-events:none;z-index:7}
.sceneUI{position:absolute;inset:0;pointer-events:none}
#vitHint{position:absolute;left:50%;transform:translateX(-50%);background:rgba(20,12,28,.92);color:var(--parch);font:12px var(--f-ui);padding:3px 10px 4px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.35);z-index:4;border:0;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#vitHint.go{color:var(--gold);cursor:pointer;animation:hintpulse 1.4s ease-in-out infinite}
@keyframes hintpulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 14px rgba(255,211,77,.6),inset 0 0 0 1px rgba(255,211,77,.6)}}
#vitHint .arr{animation:blink 1s steps(2) infinite}
#vitChip{position:absolute;right:8px;top:84px;z-index:5;font-size:12px;cursor:pointer}
#vitChip b{color:var(--gold)}
#vitChip img{width:14px;height:14px}
.sceneUI>*{pointer-events:auto}
.pximg{image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:7px 8px;z-index:8;pointer-events:none}
#hud .sp{flex:1}
.chip{pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(20,12,28,.82);padding:3px 8px 4px;font-size:14px;color:var(--parch);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.22);border:0;line-height:1.2;font-variant-numeric:tabular-nums}
.chip img{width:16px;height:16px}
.chip .lbl{font-size:11px;color:var(--parch3);letter-spacing:.06em;text-transform:uppercase}
#cCoins b{color:var(--gold);font-weight:700;min-width:2.2em;display:inline-block}
#cRep{letter-spacing:1px;color:var(--gold)}
#cRep i{color:#5e4a3a;font-style:normal}

/* Navegación entre estaciones */
#nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;background:linear-gradient(#2e1c22,#1a0f14);box-shadow:inset 0 2px 0 #5e3832,inset 0 4px 0 #140c1c;z-index:9}
#nav button{flex:1;background:none;border:0;color:#a88a6e;font:500 12px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;letter-spacing:.04em}
#nav button img{width:20px;height:20px;opacity:.75}
#nav button.on{color:var(--gold)}
#nav button.on img{opacity:1}
#nav button[disabled]{color:#5e4a44;cursor:default}
#nav button[disabled] img{opacity:.35}
#navInd{position:absolute;top:0;height:3px;background:var(--gold);box-shadow:0 0 10px var(--gold);transition:left .5s cubic-bezier(.65,0,.35,1)}
.badge{position:absolute;margin:-30px 0 0 26px;min-width:16px;height:16px;padding:0 3px;box-sizing:border-box;background:#c8323c;color:#fff;font-size:11px;line-height:16px;box-shadow:0 0 0 2px var(--ink)}

/* Ventanilla */
#bubble{position:absolute;left:14px;right:14px;background:var(--parch);color:var(--ink-soft);padding:9px 12px 11px;font-size:16px;line-height:1.35;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--parch2),0 0 0 6px var(--ink),0 10px 0 4px rgba(0,0,0,.28);z-index:3;min-height:2.7em;cursor:pointer}
#bubble b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a1f34;margin-bottom:2px}
#bubble p{margin:0;text-wrap:pretty}
#bubble .tail{display:none;position:absolute;bottom:-12px;width:16px;height:12px;background:var(--ink);clip-path:polygon(0 0,100% 0,20% 100%)}
#bubble .tail::after{content:"";position:absolute;left:3px;top:0;width:10px;height:8px;background:var(--parch);clip-path:polygon(0 0,100% 0,15% 100%)}
#bubble .more{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--parch3);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#stamps,#vNext{position:absolute;left:0;right:0;bottom:52px;height:96px;display:flex;gap:10px;padding:0 12px 8px;box-sizing:border-box;align-items:flex-end;z-index:4}
#vNext{justify-content:center}
.stamp{flex:1;position:relative;height:86px;border:0;background:none;padding:0}
.stamp .knob{position:absolute;left:50%;top:0;width:28px;height:20px;transform:translateX(-50%);border-radius:50% 50% 35% 35%;background:var(--k);box-shadow:inset -5px -3px 0 rgba(0,0,0,.35),inset 4px 3px 0 rgba(255,255,255,.28),0 0 0 2px var(--ink)}
.stamp .neck{position:absolute;left:50%;top:19px;width:12px;height:14px;transform:translateX(-50%);background:var(--k2);box-shadow:0 0 0 2px var(--ink),inset -3px 0 0 rgba(0,0,0,.3)}
.stamp .block{position:absolute;left:2px;right:2px;top:33px;height:20px;background:#7d4e3c;box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 #a06a48,inset 0 -4px 0 #45282c}
.stamp .face{position:absolute;left:6px;right:6px;top:53px;height:26px;display:grid;place-items:center;background:var(--inkc);color:#fff4e0;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 0 2px var(--ink),inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.18)}
.stamp.red{--k:#d8434e;--k2:#8a1f34;--inkc:#9a2030}
.stamp.amber{--k:#ffb84a;--k2:#a8642a;--inkc:#a8642a}
.stamp.green{--k:#6cd06a;--k2:#2f6b34;--inkc:#2f7a3a}
.stamp[disabled]{filter:grayscale(.9) brightness(.55);cursor:default}
.stamp.ready .face{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--ink),0 0 16px 2px rgba(108,208,106,.75),inset 0 -3px 0 rgba(0,0,0,.3)}}
.stamp.slam{animation:slam .34s cubic-bezier(.3,0,.3,1.4)}
@keyframes slam{0%{transform:none}35%{transform:translateY(-20px) scale(1.06)}70%{transform:translateY(7px) scale(.96,.9)}100%{transform:none}}
.btn{border:0;padding:0 16px;height:46px;background:linear-gradient(#5e3832,#45282c);color:var(--parch);font:500 15px var(--f-ui);letter-spacing:.03em;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #7d4e3c,inset 0 -3px 0 #2e1c22;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn img{width:20px;height:20px}
.btn.gold{background:linear-gradient(#ffd34d,#e8a33a);color:#3a2418;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #fff0b0,inset 0 -3px 0 #a8642a}
.btn.big{height:54px;padding:0 26px;font-size:17px}
.btn[disabled]{filter:grayscale(.8) brightness(.6);cursor:default}
.btn.glowy{animation:glowy 1.4s ease-in-out infinite}
@keyframes glowy{50%{box-shadow:0 0 0 2px var(--ink),0 0 20px 4px rgba(255,211,77,.55),inset 0 2px 0 #fff0b0,inset 0 -3px 0 #a8642a}}
#potInfo{position:absolute;left:50%;transform:translateX(-50%);bottom:152px;background:rgba(20,12,28,.9);padding:5px 10px;font-size:13px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.3);z-index:4}
#potInfo em{font-style:normal;color:var(--gold)}

/* Taller */
#predict{position:absolute;left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink-soft);padding:5px 12px 6px;font-size:14px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 -2px 0 var(--parch2);z-index:3;text-align:center;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis}
#predict small{display:block;font-size:11px;color:#7a5a3a;margin-top:1px}
#predict.warn{background:#ffd9c8;color:#8a1f34;animation:shakeX .25s linear infinite}
@keyframes shakeX{25%{transform:translateX(calc(-50% - 1px))}75%{transform:translateX(calc(-50% + 1px))}}
#qual{color:#a8642a;letter-spacing:1px}
#tCtrl{position:absolute;left:0;right:0;bottom:158px;height:50px;display:flex;gap:6px;align-items:center;padding:0 8px;box-sizing:border-box;z-index:4}
#modes{flex:1;display:flex;gap:5px;min-width:0}
.mode{flex:1;min-width:0;height:46px;border:0;background:#2e1c22;color:#cdb08a;font:500 11px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #5e3832,inset 0 -3px 0 #1e1218}
.mode img{width:18px;height:18px}
.mode.on{background:#5e3832;color:var(--gold);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--gold),0 0 16px rgba(255,211,77,.4)}
#tCtrl .btn{height:46px;padding:0 10px;font-size:13px}
#bBottle{min-width:86px}
#drawer{position:absolute;left:0;right:0;bottom:52px;height:104px;background:linear-gradient(#3d2428,#22141a);box-shadow:inset 0 2px 0 #7d4e3c,inset 0 4px 0 #140c1c;z-index:4}
#ingList{display:flex;gap:9px;overflow-x:auto;padding:11px 10px 9px;height:100%;box-sizing:border-box;scrollbar-width:none;touch-action:pan-x}
#ingList::-webkit-scrollbar{display:none}
.ing{flex:0 0 76px;background:#1e1218;border:0;color:var(--parch);padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px #5e3832;font:400 11px/1.1 var(--f-ui);text-align:center;position:relative}
.ing:active{transform:translateY(2px)}
.ing canvas{width:36px;height:36px}
.ing .nm{min-height:2.2em;display:flex;align-items:center}
.ing .es{display:flex;gap:4px;font-size:11px;align-items:center;color:var(--parch2)}
.ing .es img{width:11px;height:11px;margin-right:1px;vertical-align:-1px}
.ing .es .unk{color:#8a7a9a;letter-spacing:.1em}
.ing.flash{animation:ingflash .8s}
@keyframes ingflash{30%{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--gold),0 0 18px rgba(255,211,77,.7)}}
#waitBadge{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:rgba(20,12,28,.88);padding:5px 10px;font-size:12px;white-space:nowrap;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(216,67,78,.5);z-index:5;cursor:pointer}
#waitBadge img{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
#gusSay{position:absolute;background:var(--parch);color:var(--ink-soft);font-size:12px;padding:4px 8px;box-shadow:0 0 0 2px var(--ink);white-space:nowrap;z-index:4;transform:translateX(-100%)}

/* Avisos */
#toast{position:absolute;left:50%;top:124px;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;background:rgba(20,12,28,.94);color:var(--parch);padding:8px 12px;font-size:13px;line-height:1.3;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(255,211,77,.35);z-index:30;text-align:center;animation:toastIn .25s ease-out}
#toast.bad{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(216,67,78,.8)}
@keyframes toastIn{from{transform:translate(-50%,-8px);opacity:0}}
#soot{position:absolute;left:0;top:0;z-index:25;touch-action:none}
#sootHint{position:absolute;left:0;right:0;bottom:46%;text-align:center;z-index:26;font-size:15px;color:#ffd9b0;text-shadow:0 2px 0 #000;pointer-events:none;animation:blink 1.2s steps(2) infinite}

/* Superposiciones */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(8,4,12,.6)}
.ov[hidden]{display:none!important}
.paper{background:var(--parch);color:var(--ink-soft);box-shadow:0 0 0 2px var(--ink),0 0 0 5px var(--parch3),0 0 0 7px var(--ink),0 18px 40px rgba(0,0,0,.55);position:relative}

/* Portada */
#ovTitle{background:radial-gradient(ellipse at 50% 38%,rgba(13,8,18,.15),rgba(13,8,18,.82) 70%);flex-direction:column;justify-content:flex-start;padding-top:22%;gap:6px;text-align:center}
#logo{font:400 92px/0.9 var(--f-disp);margin:0;background:linear-gradient(180deg,#fff6c8 0%,#ffd34d 38%,#e8a33a 62%,#b9522c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1a1a) drop-shadow(0 0 22px rgba(255,170,60,.55));animation:logoIn 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes logoIn{from{transform:scale(.6) translateY(20px);opacity:0;filter:blur(6px)}}
#ovTitle .tag{font-size:15px;color:var(--parch);text-shadow:0 2px 0 #000;max-width:24em;line-height:1.4}
#ovTitle .tag em{color:var(--gold);font-style:normal}
#ovTitle .btn{margin-top:22px}
#ovTitle .ver{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:#a88a6e;text-shadow:0 1px 0 #000}

/* Edicto */
.scroll{width:min(330px,100%);padding:26px 22px 22px;box-sizing:border-box;text-align:center;animation:unfurl .75s cubic-bezier(.2,.8,.2,1);background:linear-gradient(#f3e6c6,#e6d2a6);color:#3a2418}
.scroll::before,.scroll::after{content:"";position:absolute;left:-10px;right:-10px;height:12px;background:linear-gradient(#a06a48,#5e3832);box-shadow:0 0 0 2px var(--ink)}
.scroll::before{top:-10px}.scroll::after{bottom:-10px}
@keyframes unfurl{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.scroll h2{font:400 34px/1 var(--f-disp);margin:0 0 2px;color:#5a1a24}
.scroll .num{font:italic 14px var(--f-print);color:#7a5a3a;margin-bottom:12px}
.scroll p{font:17px/1.42 var(--f-print);margin:0 0 12px;text-wrap:pretty}
.scroll .sig{font:italic 14px var(--f-print);color:#7a5a3a}
.scroll .ban{display:inline-block;margin:2px 0 14px;padding:3px 10px;font:700 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:#9a2030;box-shadow:0 0 0 2px #9a2030}
.seal{display:block;margin:6px auto 0;width:72px;height:72px;animation:sealDrop .5s .65s both cubic-bezier(.4,0,.6,1.6)}
@keyframes sealDrop{from{transform:scale(3) rotate(-20deg);opacity:0}}
.scroll .btn{margin-top:14px}

/* Resultado */
.card{width:min(320px,100%);padding:20px 18px 18px;box-sizing:border-box;text-align:center;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card canvas{width:96px;height:128px;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 18px var(--glow,rgba(255,211,77,.5)))}
.card h3{font:700 22px var(--f-ui);margin:0;color:#3a2418}
.card .meta{font-size:13px;color:#7a5a3a;margin:3px 0}
.card .sec{font-size:13px;margin:6px 0 2px}
.card .q{color:#a8642a;font-size:18px;letter-spacing:2px}
.card .acts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.card .btn{width:100%}
.newstamp{position:absolute;top:16px;right:-8px;transform:rotate(12deg);font:700 13px var(--f-ui);letter-spacing:.06em;color:#9a2030;padding:4px 8px;box-shadow:0 0 0 3px #9a2030;background:rgba(239,224,189,.85);animation:stampIn .4s cubic-bezier(.3,0,.3,1.5)}
@keyframes stampIn{from{transform:rotate(12deg) scale(2.6);opacity:0}}

/* Libro (códice y libreta) */
.book{width:min(360px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px 16px;box-sizing:border-box;background:#efe0bd}
.book h2{font:400 32px/1 var(--f-disp);margin:0 0 10px;color:#5a1a24;text-align:center}
.book h4{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#8a1f34;margin:14px 0 6px}
.grid5{display:grid;grid-template-columns:28px repeat(3,1fr);gap:3px;font-size:12px}
.grid5 .h{font-size:11px;color:#7a5a3a;text-align:center;padding:2px 0}
.grid5 .r{display:grid;place-items:center}
.grid5 .r img{width:14px;height:14px}
.cell{padding:6px 2px;text-align:center;background:#e2cfa4;color:#3a2418;box-shadow:inset 0 0 0 1px #c6ad80;min-height:16px;display:grid;place-items:center;line-height:1.1}
.cell.unk{color:#a8916a;background:#d9c296}
.cell.new{animation:ingflash 1.2s 2}
.ings{display:grid;gap:4px;font-size:13px}
.ings div{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;background:#e2cfa4}
.ings span{display:flex;gap:6px;align-items:center;white-space:nowrap}
.ings img{width:11px;height:11px}
.note{padding:10px;background:#e2cfa4;margin-bottom:8px;box-shadow:inset 0 0 0 1px #c6ad80}
.note b{display:block;font-size:12px;color:#8a1f34;text-transform:uppercase;letter-spacing:.06em}
.note q{font:italic 15px/1.35 var(--f-print);display:block;margin-top:4px}
.book .btn{width:100%;margin-top:14px}
.empty{font:italic 15px var(--f-print);color:#7a5a3a;text-align:center;padding:8px}

/* Cierre */
.ledger{width:min(330px,100%);padding:20px 18px;box-sizing:border-box;background:#efe0bd}
.ledger h2{font:400 32px/1 var(--f-disp);margin:0 0 4px;color:#5a1a24;text-align:center}
.ledger .sub{text-align:center;font:italic 14px var(--f-print);color:#7a5a3a;margin-bottom:12px}
.ledger table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ledger td{padding:5px 2px;border-bottom:1px dashed #c6ad80}
.ledger td:last-child{text-align:right;white-space:nowrap}
.ledger .pos{color:#2f7a3a}.ledger .neg{color:#9a2030}
.ledger tfoot td{font-weight:700;border-bottom:0;padding-top:8px}
.ledger .btn{width:100%;margin-top:16px}

/* La Gaceta */
#ovGaceta{background:rgba(8,4,12,.85);align-items:flex-start;overflow:auto}
.gaceta{width:min(380px,100%);margin:auto 0;padding:16px 16px 18px;box-sizing:border-box;background:#efe5cc;background-image:radial-gradient(rgba(90,60,30,.07) 1px,transparent 1.4px);background-size:5px 5px;color:#211810;box-shadow:0 0 0 2px var(--ink),0 22px 50px rgba(0,0,0,.6);animation:press .7s cubic-bezier(.2,.9,.25,1.15)}
@keyframes press{0%{transform:translateY(110%) rotate(3deg)}100%{transform:none}}
.gaceta .mast{text-align:center;border-bottom:3px double #211810;padding-bottom:6px}
.gaceta .mast h1{font:400 42px/0.95 var(--f-disp);margin:0;letter-spacing:.01em}
.gaceta .mast div{font:italic 12px var(--f-print);display:flex;justify-content:space-between;gap:6px;border-top:1px solid #211810;margin-top:6px;padding-top:3px}
.gaceta .lead{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #211810}
.gaceta .lead h2{font:400 24px/1.08 var(--f-head);margin:0;text-wrap:balance}
.gaceta .lead p{font:14px/1.35 var(--f-print);margin:6px 0 0}
.gaceta .lead canvas{width:92px;height:92px;background:#d9cba8;box-shadow:inset 0 0 0 1px #211810;filter:grayscale(.55) sepia(.45) contrast(1.2)}
.gaceta .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px}
.gaceta h3{font:400 15px/1.1 var(--f-head);margin:6px 0 4px;border-bottom:1px solid #211810;padding-bottom:2px}

  ov.innerHTML='<div class="ledger paper"><h2>Cierre del día</h2><div class="sub">Libro de cuentas · Día '+S.day+'</div><table><tbody>'+(rows||'<tr><td>Sin ventas</td><td>0</td></tr>')+'<tr><td>Tasa diaria del Gremio</td><td class="neg">−'+tax+'</td></tr>'+(rent?'<tr><td>Alquiler semanal (el casero lo sube)</td><td class="neg">−'+rent+'</td></tr>':'')+'</tbody><tfoot><tr><td>Balance del día</td><td>'+(inc-tax-rent>=0?'+':'')+(inc-tax-rent)+'</td></tr><tr><td>En la caja</td><td>'+(S.coins-tax-rent)+'</td></tr></tfoot></table><button class="btn gold" id="lOk">Dormir</button></div>';ov.hidden=false;AU.paper();
  $('#lOk').onclick=()=>{S.coins-=tax+rent;S.rentIn=rent?7:S.rentIn-1;refreshHUD();ov.hidden=true;showGaceta()}}
function headlineFor(e){const p=e.p,sec=p.sec&&!p.distilled?p.sec:null,n=e.name;
  const H2={pellejo:{silencio:sec==='ign'?['Una vecina de la calle Mayor enmudece y eructa humo en misa','Su nuera lo califica de «milagro». El párroco, de «incendio».']:['Silencio inexplicable en la calle Mayor','Los vecinos duermen del tirón por primera vez en veinte años.'],encoger:['Una anciana de doce centímetros sigue quejándose del precio del pan','«Ahora el pan le parece aún más caro», explica su nuera.'],sueno:['Una señora duerme tres días seguidos y su familia organiza una fiesta','Al despertar ha preguntado quién se había comido los canapés.'],poli:['Una gallina reclama la herencia de la familia Pellejo','El notario estudia el caso: «Firma con la pata, así que es válido».']},
    mantecas:{valor:sec==='cao'?['Sir Mantecas gana el torneo… a pesar de los cuernos','Sus rivales huyeron al verle embestir. Él dice que fue estrategia.']:['Sir Mantecas gana el torneo: «Nunca tuve miedo», declara temblando','Fuentes cercanas aseguran que se desmayó después, en privado.']},
    mantecas2:{antimal:['Sir Mantecas recupera su frente y pierde su encanto','Su señora ha guardado los cuernos en una vitrina.']},
    gorzag:{carisma:['Cola de inversores ante «Oportunidades Gorzag»','El Gremio abre una investigación. Los inversores, la cartera.'],amor:['Una multitud enamorada persigue a un goblin con traje','Ninguno le ha dado dinero. «El amor no es negocio», lamenta.']},
    ignatius:{sueno:['Un dragón duerme la siesta en mitad de la plaza','El Ayuntamiento lo declara monumento para no tener que moverlo.'],olvido:['Un dragón olvida que es un dragón y pide trabajo en la panadería','Le han contratado: el horno ya no hace falta.']},
    lirio:{carisma:['Lirio Dorado provoca un tumulto en la plaza: tres desmayos y un laúd roto','El bardo asegura que «solo era un ensayo».'],fuego:['El bardo Lirio Dorado escupe fuego en pleno concierto','Público entusiasmado; cejas, menos.'],invisible:['Desaparece Lirio Dorado','Sus seguidores no lo han notado.']}};
  const sp=H2[e.id]&&H2[e.id][p.eff];if(sp)return{h:sp[0],t:sp[1],score:5+(e.ban?3:0)};
  return{h:n+' sale de la botica con '+EFN[p.eff].toLowerCase()+(sec?' y '+SEC[sec]:''),t:e.s>=2?'Se declara «satisfecho, en general».':'Ha presentado una queja en el Gremio.',score:2+(sec?1:0)+(e.ban?3:0)}}
function showGaceta(){const ov=$('#ovGaceta');const served=S.log.filter(e=>e.act==='serve');const heads=served.map(e=>Object.assign({e},headlineFor(e))).sort((a,b)=>b.score-a.score);
  const lead=heads[0]||{h:S.exploded?'Explosión en la botica de la plaza':'La botica de la plaza, más cerrada que el Gremio un viernes',t:S.exploded?'Ningún herido salvo la dignidad del becario.':'Ni una poción vendida. Los vecinos se automedican con sopa.'};
  const brev=heads.slice(1).map(x=>'<p class="it"><b>'+x.h+'.</b> '+x.t+'</p>').join('')+S.log.filter(e=>e.act==='rej').map(e=>'<p class="it"><b>'+e.name+' se queja</b> de que la botica «no atiende ni a su madre».</p>').join('')+(served.some(e=>e.ban)?'<p class="it"><b>El Gremio investiga</b> ventas prohibidas en la plaza. «Tenemos un formulario para eso», advierten.</p>':'');
  const revs=S.log.filter(e=>e.act==='serve'||e.act==='rej').map(e=>{const s=e.act==='rej'?0:e.s;const st=[1,2,4,5][s];const txt=e.act==='rej'?'«Ni me atendió. Bueno, me atendió para decirme que no.»':pick([['«No funcionó. Bueno, algo funcionó, pero no lo que pedí.»','«Una estrella porque no se puede poner cero.»'],['«Regular. Mi primo hace pociones mejores, y es herrero.»'],['«Funciona. No sé cómo, pero funciona.»','«Buen servicio. El homúnculo daba un poco de pena.»'],['«¡Milagroso! Volveré.»','«Cinco estrellas. Habría puesto seis.»']][s]);return'<p class="it"><span class="st">'+'★'.repeat(st)+'☆'.repeat(5-st)+'</span> '+txt+' <i>— '+e.name+'</i></p>'}).join('')||'<p class="it">Nadie ha opinado. Ni para mal.</p>';
  const next=planNextDay(true);const horo={ignatius:'Dragón: hoy no es tu día. Ni ayer. Ni los últimos trescientos años.',lirio:'Leo: todos te mirarán. O eso querrías.',mantecas2:'Capricornio: algo te crece en la cabeza, y no son ideas.',pellejo:'Virgo: alguien de tu familia no se calla. Paciencia.',gorzag:'Escorpio: una oportunidad única llamará a tu puerta. Otra vez.',mantecas:'Aries: el valor no se compra. Bueno, a veces sí.'};
  const hs=next.map(id=>horo[id]).filter(Boolean);if(!hs.length)hs.push('Sagitario: hoy olvidarás algo importante. Como este horóscopo.');
  const cls=['SE BUSCA becario. Sin sueldo. Imprescindible estómago de hierro. Razón: botica de la plaza.','GREMIO DE ALQUIMISTAS: ¿Ha rellenado el formulario A-38? Nosotros tampoco lo encontramos.','CLASES de laúd. Que alguien se las dé a Lirio Dorado, por favor.','SE ALQUILA torre con vistas a la plaza. Sin dragón. Bueno, a veces.'];if(S.flags.horns)cls.unshift('SE VENDE yelmo de talla grande, con dos agujeros. Preguntar por Sir M.');
  const necro=S.exploded?'<b>Necrológicas.</b> El caldero de la botica de la plaza, tras toda una vida de servicio. Descanse en pedazos.':'<b>Necrológicas.</b> Don Ruperto, que compró un elixir de juventud en una botica sin licencia. Ha vuelto a la lactancia; le sobreviven sus hijos, ahora mayores que él.';
  ov.innerHTML='<div class="gaceta"><div class="mast"><h1>La Gaceta de Vialix</h1><div><span>Año 412 de la Ventanilla Única</span><span>Día '+(S.day+1)+'</span><span>3 cobres</span></div></div><div class="lead"><div><h2>'+lead.h+'</h2><p>'+lead.t+'</p></div><canvas width="46" height="46" class="pximg" id="gzPic"></canvas></div><div class="cols"><div><h3>Breves</h3>'+(brev||'<p class="it">Nada que contar. El Gremio lo celebra.</p>')+'<h3>Horóscopo del mago</h3>'+hs.map(h=>'<p class="it">'+h+'</p>').join('')+'</div><div><h3>Reseñas del tablón</h3>'+revs+'<h3>Clasificados</h3>'+cls.slice(0,2).map(c=>'<p class="it">'+c+'</p>').join('')+'</div><p class="it full">'+necro+'</p></div><button class="btn gold" id="gOk">Empezar el día '+(S.day+1)+'</button></div>';
  ov.hidden=false;ov.scrollTop=0;AU.press();later(.15,()=>AU.press());later(.3,()=>AU.paper());
  // ilustración del titular
  const pc=$('#gzPic').getContext('2d');pc.imageSmoothingEnabled=false;pc.fillStyle='#d9cba8';pc.fillRect(0,0,46,46);if(heads[0]){const e=heads[0].e;const d=clientDef(e.id);const act={mods:modsFor(e.p)};if(d.horns&&e.p.eff!=='antimal')act.mods.horns=1;if(d.dragon){const b=buildDragon();pc.drawImage(e.p.eff==='sueno'?b.sleep:b.fr[0],-8,-6,76,53)}else if(d.target==='suegra'){const b=buildBust({skin:'#efd2b8',skinD:'#c9a68a',hair:'#e6e2ee',hairD:'#b5b0c8',style:'bun',outfit:'robe',cloth:'#2b2a3d',clothD:'#1c1b29',clothL:'#3d3c55',acc:['pearls'],brow:'stern',rx:14,ry:17},'suegra');const[tc,tg]=mk(90,100);drawActor(tg,b.fr[0],8,10,act,{meta:b.meta,big:2});pc.drawImage(tc,8+b.meta.hx-23,10+b.meta.hy-24,46,46,0,0,46,46)}else{const b=buildBust(d.spec,d.key);const[tc,tg]=mk(90,100);drawActor(tg,b.fr[0],8,10,act,{meta:b.meta,big:2});pc.drawImage(tc,8+b.meta.hx-23,10+b.meta.hy-24,46,46,0,0,46,46)}}else{pc.drawImage(T.cauldron.img,0,8,46,24)}
  $('#gOk').onclick=()=>{ov.hidden=true;newDay()}}
function planNextDay(dry){let q=[...S.libreta];if(S.day===1){q.push('ignatius','lirio');if(S.flags.horns)q.push('mantecas2')}else{if(S.flags.horns&&!S.flags.hornsDone&&!q.includes('mantecas2'))q.push('mantecas2');for(let i=0;i<3-Math.min(2,S.libreta.length);i++)q.push('gen'+(S.day*10+i))}return q}
function newDay(){const q=planNextDay();S.day++;S.queue=q;S.returning=new Set(S.libreta);S.libreta=[];S.total=q.length;S.served=0;S.dayT=0;S.log=[];S.gus=3;S.exploded=false;S.flags.gusSoot=false;S.carry=S.carryNext.slice(-6);S.carryNext=[];S.edict=EDICTS[(S.day-1)%EDICTS.length];S.edictNew=true;if(S.flags.horns&&q.includes('mantecas2'))S.flags.hornsDone=true;
  for(const id of q)if(id.startsWith('gen')&&!S.gens[id]){const r=mulberry(id.length*31+parseInt(id.slice(3)));const tpl=GEN_REQ[(r()*GEN_REQ.length)|0];const sp=genSpec(parseInt(id.slice(3))*7+3);S.gens[id]=Object.assign({id,gen:1,name:GEN_NAMES[(r()*GEN_NAMES.length)|0],spec:sp,key:id,small:{skin:sp.skin,hair:sp.hair,cloth:sp.cloth,hat:'none'},drinks:true,miss:'Esto no es lo que pedí. Pero gracias por intentarlo. O no.',apunta:'Vuelvo mañana, entonces.',rechazo:'Pues nada. Me iré a llorar a la fuente.',wait:'Sigo esperando, ¿eh?',back:'He vuelto. ¿Tiene lo mío?'},tpl)}
  V.closing=false;V.shutterTo=0;V.walkers=[];V.setQueue();refreshHUD();$('#vNext').hidden=true;
  later(.4,()=>showEdict(true))}

// ───────────────────────── hollín tras la explosión ─────────────────────────
let soot=null;
function showSoot(){const c=$('#soot');c.width=Math.round(cssW/2);c.height=Math.round(cssH/2);c.style.width=cssW+'px';c.style.height=cssH+'px';const g=c.getContext('2d');g.fillStyle='rgba(20,14,22,.0)';g.clearRect(0,0,c.width,c.height);for(let i=0;i<70;i++){const x=rnd(c.width),y=rnd(c.height),r=rnd(18,60);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(18,12,20,.95)');gr.addColorStop(.7,'rgba(26,18,26,.8)');gr.addColorStop(1,'rgba(26,18,26,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}c.hidden=false;$('#sootHint').hidden=false;soot={c,g,t:0,strokes:0}}
function sootWipe(x,y){if(!soot)return;const g=soot.g;g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x/2,y/2,22,0,TAU);g.fill();g.globalCompositeOperation='source-over';soot.strokes++;if(soot.strokes%10===0){const d=g.getImageData(0,0,soot.c.width,soot.c.height).data;let n=0,tot=0;for(let i=3;i<d.length;i+=64){tot++;if(d[i]>60)n++}if(n/tot<.12)endSoot()}}
function endSoot(){if(!soot)return;const c=soot.c;soot=null;c.style.transition='opacity .5s';c.style.opacity='0';$('#sootHint').hidden=true;setTimeout(()=>{c.hidden=true;c.style.opacity='';c.style.transition=''},500)}
$('#soot').addEventListener('pointerdown',e=>{e.preventDefault();const r=frame.getBoundingClientRect();sootWipe(e.clientX-r.left,e.clientY-r.top);soot&&(soot.down=1)});
$('#soot').addEventListener('pointermove',e=>{if(!soot||!soot.down)return;const r=frame.getBoundingClientRect();sootWipe(e.clientX-r.left,e.clientY-r.top)});
addEventListener('pointerup',()=>{if(soot)soot.down=0});

// ───────────────────────── entrada ─────────────────────────
let pd=null;
function fpos(e){const r=frame.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function onDown(e){if(cam.t<1||cam.drag)return;const[fx,fy]=fpos(e);pd={x:fx,y:fy,base:Math.round(cam.x),used:false};const sc=pd.base===0?V:T;pd.used=!!sc.pointer('down',fx/u,fy/u);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
function onMove(e){if(!pd)return;const[fx,fy]=fpos(e);const dx=fx-pd.x,dy=fy-pd.y;const sc=pd.base===0?V:T;
  if(pd.used){sc.pointer('move',fx/u,fy/u);return}
  if(!cam.drag&&Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.3){cam.drag=true;cam.t=1}
  if(cam.drag)cam.x=clamp(pd.base-dx/cssW,0,1)}
function onUp(e){if(!pd)return;const[fx,fy]=fpos(e);const sc=pd.base===0?V:T;sc.pointer('up',fx/u,fy/u);
  if(cam.drag){cam.drag=false;const mv=cam.x-pd.base;const target=Math.abs(mv)>.2?(mv>0?Math.min(1,pd.base+1):Math.max(0,pd.base-1)):pd.base;if(target!==pd.base)navTo(target,true);else{cam.from=cam.x;cam.to=target;cam.t=0;cam.dur=.3}}
  pd=null}
FACES.forEach(f=>{f.cv.addEventListener('pointerdown',onDown);f.cv.addEventListener('pointermove',onMove);f.cv.addEventListener('pointerup',onUp);f.cv.addEventListener('pointercancel',onUp)});
document.querySelectorAll('#nav button[data-s]').forEach(b=>b.addEventListener('click',()=>navTo(+b.dataset.s)));
$('#stR').onclick=e=>{slam(e.currentTarget);V.act('rej')};$('#stA').onclick=e=>{slam(e.currentTarget);V.act('note')};$('#stS').onclick=e=>{if(V.sel<0)return;slam(e.currentTarget);V.act('serve')};
function slam(b){b.classList.remove('slam');void b.offsetWidth;b.classList.add('slam');AU.stamp();vibrate(15);const r=b.getBoundingClientRect(),fr=frame.getBoundingClientRect();const x=(r.left+r.width/2-fr.left)/u,y=(r.top-fr.top)/u;for(let i=0;i<10;i++)part(V.parts,{k:'px',x:x+rnd(-8,8),y:y+rnd(20,30),vx:rnd(-40,40),vy:rnd(-30,0),g:120,life:.4,max:.4,c:getComputedStyle(b).getPropertyValue('--inkc').trim()||'#9a2030',front:1})}
$('#bNext').onclick=()=>{if(S.queue.length)V.callNext();else closeShop()};
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>T.setMode(b.dataset.m)));
$('#bBottle').onclick=()=>T.bottle();
$('#bCodex').onclick=()=>showCodex();
$('#waitBadge').onclick=()=>navTo(0);
$('#vitChip').onclick=()=>navTo(0);
$('#vitHint').onclick=()=>{if($('#vitHint').classList.contains('go'))navTo(1)};
$('#bCam').onclick=()=>{AU.init();camMode=CAMS[(CAMS.indexOf(camMode)+1)%CAMS.length];try{localStorage.setItem('vialix-cam',camMode)}catch(_){}toast('Cámara: '+CAMN[camMode]+'. Desliza para probarla.');const tgt=Math.round(cam.x)?0:1;navTo(tgt);later(1.6,()=>navTo(1-tgt))};
$('#bSound').onclick=()=>{AU.init();AU.on=!AU.on;$('#iSound').src=AU.on?ICON.snd:ICON.mute;AU.setAmb(AU.on?(cam.to?'fire':'plaza'):'');try{localStorage.setItem('vialix-sound',AU.on?'1':'0')}catch(_){}};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')navTo(1);if(e.key==='ArrowLeft')navTo(0)});
$('#bStart').onclick=()=>{AU.init();AU.setAmb('plaza');$('#ovTitle').hidden=true;S.started=true;S.edictNew=true;showEdict(true)};
addEventListener('resize',()=>{resize()});

// ───────────────────────── bucle principal ─────────────────────────
let last=performance.now();
function update(dt){
  clock+=dt;
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f()}}
  if(cam.t<1&&!cam.drag){cam.t=Math.min(1,cam.t+dt/cam.dur);cam.x=lerp(cam.from,cam.to,easeIO(cam.t))}
  refreshHints();
  V.update(dt);T.update(dt);updSay(dt);
  if(V.bellT>0)V.bellT-=dt;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').hidden=true}
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*3);
  // aviso en el taller si hay alguien esperando
  const wb=$('#waitBadge');const waiting=V.cl&&V.cl.state==='wait';if(waiting&&cam.to===1){wb.hidden=false;const imp=V.away>25?' · se impacienta':'';wb.innerHTML='<img class="pximg" src="'+ICON.bell+'" alt="">'+V.cl.def.name+' espera en la ventanilla'+imp}else wb.hidden=true;
  const tb=$('#tBadge');if(V.cl&&V.cl.state==='wait'&&cam.to===0&&!S.vitrina.length){tb.hidden=false;tb.textContent='!'}else tb.hidden=true;
}
function render(){
  const sx=shake>0?Math.round(rnd(-shake,shake))*s:0,sy=shake>0?Math.round(rnd(-shake,shake))*s:0;
  const scenes=[V,T];
  for(let i=0;i<2;i++){if(Math.abs(i-cam.x)>=.999)continue;const sc=scenes[i],f=FACES[i];X=f.ctx;X.setTransform(1,0,0,1,0,0);X.imageSmoothingEnabled=false;X.fillStyle='#000';X.fillRect(0,0,f.cv.width,f.cv.height);
    sc.render();X.drawImage(sc.buf,sx,sy,W*s,H*s);sc.fx(sx,sy);
    if(flash>0){X.fillStyle=`rgba(255,240,210,${flash})`;X.fillRect(0,0,f.cv.width,f.cv.height)}}
  applyCam();
}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(hitstop>0){hitstop-=dt;dt=0}update(dt);render();requestAnimationFrame(loop)}

// ───────────────────────── arranque ─────────────────────────
function boot(){
  makeIcons();makeCritters();makeIngSprites();
  S.gens={};S.carryNext=[];
  S.ambient=[{spec:{skin:'#e0a57a',hair:'#3a2418',cloth:'#4f8a4a',hat:'pointy',hatc:'#3f5a7a'},mods:{float:1}},{spec:{skin:'#f2c9a0',hair:'#c99a2e',cloth:'#b5463f',hat:'none',dress:1},mods:{duck:1}},{spec:{skin:'#b9784f',hair:'#1c1b29',cloth:'#c48a3a',hat:'cap'},mods:{scale:.5}},{spec:{skin:'#f0d0b8',hair:'#7a4a2a',cloth:'#3f6fb5',hat:'none'},mods:{tint:'#a3a1b5'}},{spec:{skin:'#e0a57a',hair:'#9a92b5',cloth:'#8a5bb5',hat:'hood'},mods:{hearts:1}}];
  $('#iCoin').src=ICON.coin;$('#iCam').src=ICON.cam;$('#iSun').src=ICON.sun;$('#iBell').src=ICON.bell;$('#iBook').src=ICON.book;
  try{AU.on=localStorage.getItem('vialix-sound')!=='0'}catch(_){}
  $('#iSound').src=AU.on?ICON.snd:ICON.mute;
  const navImgs=document.querySelectorAll('#nav button img');navImgs[0].src=ICON.win;navImgs[1].src=ICON.caul;navImgs[2].src=ICON.stall;
  const mi=document.querySelectorAll('.mode img');mi[0].src=ICON.flame;mi[1].src=ICON.snow;mi[2].src=ICON.moon;
  S.queue=['pellejo','mantecas','gorzag'];S.total=3;
  resize();V.setQueue();renderDrawer();refreshHUD();refreshPredict();
  // unos cuantos viandantes desde el principio
  for(let i=0;i<5;i++){V.spawnWalker();const w=V.walkers[V.walkers.length-1];w.x=V.o.x+rnd(V.o.w)}
  requestAnimationFrame(loop);
  window.__V={S,V,T,navTo,AU,buildBust,buildDragon,buildGus,genSpec};
}
boot();
})();
</script>
